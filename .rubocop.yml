AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Node and mark types are small classes named after what they render.
Style/Documentation:
  Enabled: false

# Literal types are checked with `===`.
Style/CaseEquality:
  Enabled: false

# Class-level declarations, like `inline` and `code`, follow ProseMirror's boolean options.
Style/OptionalBooleanParameter:
  AllowedMethods: [inline, code]

Metrics/AbcSize:
  Max: 30
  Exclude: [test/**/*]

Metrics/MethodLength:
  Max: 16
  Exclude: [test/**/*]

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Metrics/ClassLength:
  Max: 200
  Exclude: [test/**/*]

Metrics/ParameterLists:
  CountKeywordArgs: false
